services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: services/hnth-backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8788
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      HNTH_AGENT_TOKEN: ${HNTH_AGENT_TOKEN}
      HNTH_DEFAULT_AGENT_ID: ${HNTH_DEFAULT_AGENT_ID}
      WEB_ORIGIN: ${WEB_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # File .exe cập nhật Agent; mất volume thì lệnh agent-update trả 404 khi tải.
      - agent_releases:/app/services/hnth-backend/agent-releases
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_HNTH_BACKEND_URL: ${VITE_HNTH_BACKEND_URL:-}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  agent_releases:

