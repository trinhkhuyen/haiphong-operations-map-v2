appId: vn.haiphong.ops.hnth-agent
# Giữ productName cố định giữa các phiên bản; version nằm trong package.json/artifactName.
productName: Agent HNTH
directories:
  output: ../../outputs/hnth-agent-latest
files:
  - desktop/main.cjs
  - desktop/hnth-agent.png
  - package.json
extraResources:
  - from: src
    to: agent/src
  # src/probes/ping.mjs import "@haiphong-ops/hnth-protocol"; Node tìm package này trong
  # resources/agent/node_modules khi chạy bản đóng gói (không có workspace link).
  - from: ../../packages/hnth-protocol
    to: agent/node_modules/@haiphong-ops/hnth-protocol
    filter:
      - package.json
      - src/*.mjs
      - "!src/*.test.mjs"
  - from: config.json
    to: agent/config.json
win:
  target:
    - portable
  artifactName: Agent-HNTH-v${version}-Windows-Tray.exe
  requestedExecutionLevel: asInvoker
